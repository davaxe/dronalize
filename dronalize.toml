# Proposed next-generation config layout
#
# This file doubles as a parser-validated example config for docs and tests.
# Keep it aligned with the current public configuration model.
#
# Breaking changes reflected here:
# - Partial config sections are now patch sections.
# - Clearing uses `{ op = "clear" }`, or "clear" shorthand.
# - Screening merge/remove is now section-local.
# - Screening rule maps use `values = { ... }` or `[...values.<name>]`.
# - Loader options, if used, should be expressed as a DictPatch.
# - Weighted assignment strategies require explicit `ratio`.


# --------------------------------------------------------------------------------------
# Shared profiles
# --------------------------------------------------------------------------------------

[profiles.fast.runtime]
jobs = 4

[profiles.high_precision.output]
trajectory_schema = "positions_velocity_yaw"
precision = "float64"
recenter_positions = true


# Basic screening profile --------------------------------------------------------------

[profiles.basic_screening.screening.cleanup]
mode = "extend"

[profiles.basic_screening.screening.cleanup.remove_animals]
rule = "exclude"
categories = ["ANIMAL"]

[profiles.basic_screening.screening.cleanup.remove_unimportant]
rule = "exclude"
categories = ["UNIMPORTANT"]


# Strict screening profile -------------------------------------------------------------

[profiles.strict_screening.screening.agents]
mode = "extend"

[profiles.strict_screening.screening.agents.no_gap]
rule = "max_gap"
maximum = 0

[profiles.strict_screening.screening.agents.stationary]
rule = "min_distance"
minimum = 4

[profiles.strict_screening.screening.agents.stationary.tolerance]
absolute = 100

[profiles.strict_screening.screening.scenes]
mode = "extend"

[profiles.strict_screening.screening.scenes.min_agents]
rule = "agent_range"
minimum = 12


# --------------------------------------------------------------------------------------
# Dataset: waymo
# --------------------------------------------------------------------------------------

[datasets.waymo]
uses = ["strict_screening"]

# No dataset-local screening patch is needed here.
# The strict_screening profile already extends the agent and scene rule maps.


# --------------------------------------------------------------------------------------
# Dataset: a43
# --------------------------------------------------------------------------------------

[datasets.a43]
uses = ["basic_screening", "high_precision"]


# Runtime ------------------------------------------------------------------------------

# [datasets.a43.runtime]
# jobs = 1


# Scenes -------------------------------------------------------------------------------
#
# This section answers:
# - what does one scene look like?
# - how are scenes sampled from raw data?
# - should trajectories be resampled before scene construction?

[datasets.a43.scenes]
horizon_frames = 80
default_observation_length = 20
sample_time = 0.1

[datasets.a43.scenes.window]
step = 15

[datasets.a43.scenes.resample]
up = 2
down = 1
method = "cubic"
coordinates = ["x", "y"]
emit_velocity = true
emit_acceleration = true


# Screening ----------------------------------------------------------------------------
#
# Screening is separated from scene sampling so it reads as an independent policy layer.
# The three namespaces below stay because they are genuinely distinct:
# - cleanup: row/agent removal before validation
# - scene: whole-scene acceptance rules
# - agent: per-agent validity rules
#
# Breaking change:
# `remove` is no longer global under `[screening]`.
# It is now local to each rule namespace.

[datasets.a43.screening.cleanup]
mode = "extend"
remove = ["remove_unimportant"]  # from the basic_screening profile

[datasets.a43.screening.cleanup.trim_static]
rule = "exclude"
categories = ["STATIC_OBJECT", "UNIMPORTANT"]

[datasets.a43.screening.scenes]
mode = "extend"

[datasets.a43.screening.scenes.min_context]
rule = "agent_range"
minimum = 2

[datasets.a43.screening.agents]
mode = "extend"

[datasets.a43.screening.agents.anchor_present]
rule = "frames"
frames = [19]

[datasets.a43.screening.agents.anchor_present.tolerance]
absolute = 1
relative = 0.05

[datasets.a43.screening.agents.anchor_present.selector]
mode = "include"
categories = ["CAR"]

[datasets.a43.screening.agents.observation_floor]
rule = "min_observations"
minimum = 8


# Split --------------------------------------------------------------------------------
#
# Weighted assignment strategies now require an explicit ratio.

[datasets.a43.assign]
strategy = "shuffled-time"
segments = 8
gap = 2

[datasets.a43.assign.ratio]
train = 0.7
val = 0.2
test = 0.1


# Map ----------------------------------------------------------------------------------

[datasets.a43.map]
min_distance = 1.0
interpolation_distance = 2.5

[datasets.a43.map.extraction]
mode = "circle"
radius = 60.0


# Output -------------------------------------------------------------------------------

[datasets.a43.output.mds]
compression = "zstd:7"
hashes = ["sha1", "xxh64"]
size_limit = 33554432
exist_ok = true
